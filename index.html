<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Волейбол Учет</title>
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--header:#0f172a;
  --accent:#059669;--border:#e2e8f0;
  --debt:#dc2626;--ok:#16a34a;--credit:#2563eb;
  --att-yes:#22c55e;--att-no:#f97316;--pay-yes:#0d9488;--pay-no:#e11d48;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
[data-theme="dark"]{
  --bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--header:#020617;
  --accent:#10b981;--border:#334155;
  --debt:#f87171;--ok:#4ade80;--credit:#60a5fa;
  --att-yes:#22c55e;--att-no:#fb923c;--pay-yes:#14b8a6;--pay-no:#f43f5e;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px}
header{background:var(--header);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;font-weight:700}
header p{font-size:11px;opacity:.8}
.nav{display:flex;gap:6px;align-items:center}
.nav button{background:rgba(255,255,255,.12);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500}
.nav button.active{background:var(--accent)}
.theme-btn{background:rgba(255,255,255,.12);border:none;color:#fff;width:36px;height:36px;border-radius:8px;font-size:13px}
main{max-width:960px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden;border:1px solid var(--border)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat .l{font-size:11px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.stat .v.red{color:var(--debt)}
.stat .v.green{color:var(--ok)}
.btn{display:inline-block;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;border:none;cursor:pointer;background:var(--border);color:var(--text)}
.btn.primary{background:var(--accent);color:#fff}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.player-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.player-row:last-child{border-bottom:none}
.badge{font-size:11px;padding:2px 6px;border-radius:4px;margin-left:6px}
.badge.admin{background:#ede9fe;color:#5b21b6}
.badge.player{background:#dbeafe;color:#1e40af}
.badge.guest{background:#fce7f3;color:#9d174d}
.badge.fact{background:#fef3c7;color:#92400e}
[data-theme="dark"] .badge.admin{background:#4c1d95;color:#e9d5ff}
[data-theme="dark"] .badge.player{background:#1e3a8a;color:#bfdbfe}
[data-theme="dark"] .badge.guest{background:#9d174d;color:#fbcfe8}
[data-theme="dark"] .badge.fact{background:#78350f;color:#fde68a}
.debt{color:var(--debt);font-weight:600}
.ok{color:var(--ok)}
.credit{color:var(--credit)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg);padding:8px 3px;font-weight:500;color:var(--muted);text-align:center;font-size:11px}
td{padding:6px 2px;text-align:center;border-top:1px solid var(--border)}
td.name{text-align:left;padding-left:8px;min-width:110px}
.toggle-att,.toggle-pay{width:30px;height:30px;border:1px solid var(--border);background:var(--bg);font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.toggle-att{border-radius:50%}
.toggle-pay{border-radius:6px}
.toggle-att.yes{background:var(--att-yes);color:#fff;border-color:var(--att-yes)}
.toggle-att.no{background:var(--att-no);color:#fff;border-color:var(--att-no)}
.toggle-pay.yes{background:var(--pay-yes);color:#fff;border-color:var(--pay-yes)}
.toggle-pay.no{background:var(--pay-no);color:#fff;border-color:var(--pay-no)}
input,select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--card);color:var(--text)}
input[type=number]{width:52px;text-align:center}
.form-row{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px;align-items:flex-end}
.form-row label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.hidden{display:none!important}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;z-index:100;pointer-events:none;max-width:90%}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty,.loading{padding:24px;text-align:center;color:var(--muted)}
.error{padding:20px;text-align:center;color:var(--debt);background:rgba(220,38,38,.1);border-radius:12px;margin:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
.legend span{display:flex;align-items:center;gap:5px}
.add-form{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;border-top:1px solid var(--border)}
.mode-wrap{display:inline-flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.mode-btn{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;line-height:1.2}
.mode-btn.active-abo{background:#059669;color:#fff;border-color:#047857}
.mode-btn.active-fact{background:#d97706;color:#fff;border-color:#b45309}
@media (max-width:480px){
  .stat .v{font-size:18px}
  .toggle-att,.toggle-pay{width:32px;height:32px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Волейбол Учет</h1>
    <p>Посещения и оплаты</p>
  </div>
  <div class="nav">
    <button id="nav-d" class="active" onclick="show('d')">Дашборд</button>
    <button id="nav-m" onclick="show('m')">Месяц</button>
    <button class="theme-btn" onclick="toggleTheme()" title="Тема">Тема</button>
  </div>
</header>

<main>
  <div id="view-d">
    <div id="dash-loading" class="loading">Загрузка...</div>
    <div id="dash-content" class="hidden">
      <div class="stats">
        <div class="stat"><div class="l">Общий долг</div><div class="v red" id="s-debt">0</div></div>
        <div class="stat"><div class="l">Собрано</div><div class="v green" id="s-paid">0</div></div>
        <div class="stat"><div class="l">С долгом</div><div class="v" id="s-cnt">0</div></div>
        <div class="stat"><div class="l">Посещаемость</div><div class="v" id="s-att">0%</div></div>
      </div>
      <div class="card">
        <div class="card-h">Сумма к оплате <button class="btn" onclick="copyList()">Копировать</button></div>
        <div id="debt-list"></div>
      </div>
      <div class="card">
        <div class="card-h">Действия</div>
        <div class="btn-row">
          <button class="btn primary" onclick="createNextMonth()">+ Новый месяц</button>
          <button class="btn" onclick="reloadAll()">Обновить</button>
        </div>
      </div>
    </div>
  </div>

  <div id="view-m" class="hidden">
    <div class="card">
      <div class="form-row">
        <div>
          <label>Месяц</label>
          <select id="month-sel" onchange="changeMonth()"></select>
        </div>
        <div style="margin-left:auto;text-align:right">
          <label>База к оплате</label>
          <div style="font-size:18px;font-weight:700" id="base">—</div>
        </div>
      </div>
    </div>
    <div id="month-loading" class="loading hidden">Загрузка месяца...</div>
    <div id="month-error" class="error hidden"></div>
    <div class="card" id="month-table-card">
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th style="text-align:left;padding-left:8px">Игрок</th>
              <th colspan="5">Посещение</th>
              <th colspan="5">Оплата</th>
              <th>Корр</th>
              <th>Долг</th>
            </tr>
            <tr>
              <th></th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
              <th></th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="legend">
        <span><span class="toggle-att yes" style="width:18px;height:18px;font-size:10px">+</span> Был</span>
        <span><span class="toggle-att no" style="width:18px;height:18px;font-size:10px">x</span> Не был</span>
        <span><span class="toggle-pay yes" style="width:18px;height:18px;font-size:10px">+</span> Сдал</span>
        <span><span class="toggle-pay no" style="width:18px;height:18px;font-size:10px">x</span> Не сдал</span>
      </div>
      <div class="add-form">
        <div>
          <label>Имя</label>
          <input type="text" id="new-player-name" placeholder="Имя" style="width:130px">
        </div>
        <div>
          <label>Роль</label>
          <select id="new-player-role">
            <option value="Игрок">Игрок</option>
            <option value="Админ">Админ</option>
            <option value="Гость">Гость</option>
          </select>
        </div>
        <div>
          <label>Режим</label>
          <select id="new-player-mode">
            <option value="abo">Абонемент</option>
            <option value="fact">За факт</option>
          </select>
        </div>
        <button class="btn primary" onclick="addPlayer()">+ Добавить</button>
      </div>
    </div>
  </div>
</main>
<div id="toast"></div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbyppm-Tkkk4BFAERBVRjdrMsT0nFYVOb2gVdjAPfw7gn_v_vy5WV_xXgna-25I5F3qmTA/exec';
var months = [];
var currentMonth = null;
var monthData = null;

function initTheme() {
  document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
}
function toggleTheme() {
  var next = (document.documentElement.getAttribute('data-theme') || 'light') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}
initTheme();

function getMonth() {
  var fromState = currentMonth ? String(currentMonth).trim() : '';
  var sel = document.getElementById('month-sel');
  var fromSelect = (sel && sel.value) ? String(sel.value).trim() : '';
  var fromList = (months && months.length) ? String(months[0]).trim() : '';
  return fromState || fromSelect || fromList || '';
}

function apiGet(params) {
  return fetch(API_URL + '?' + new URLSearchParams(params).toString())
    .then(function(res) {
      if (!res.ok) throw new Error('Ошибка сети: ' + res.status);
      return res.json();
    })
    .then(function(data) {
      if (data.error) throw new Error(data.error);
      return data;
    });
}

function apiPost(body) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  })
    .then(function(res) {
      if (!res.ok) throw new Error('Ошибка сети: ' + res.status);
      return res.json();
    })
    .then(function(data) {
      if (data.error) throw new Error(data.error);
      return data;
    });
}

function calcPlayer(p, price, trainings) {
  var mode = p.mode === 'fact' ? 'fact' : 'abo';
  var attCount = (p.att || []).filter(function(x) { return x === 'Был'; }).length;
  var payCount = (p.pay || []).filter(function(x) { return x === 'Сдал'; }).length;
  var missed = Math.max(trainings - attCount, 0);
  var paid = payCount * price + (Number(p.adj) || 0);
  var carryIn = Number(p.carryIn) || 0;

  if (attCount === 0 && payCount === 0 && (Number(p.adj) || 0) === 0) {
    return {
      attCount: attCount, missed: missed, paid: paid, debt: carryIn, credit: 0,
      carryOut: carryIn,
      st: carryIn > 0 ? ('перенос ' + fmt(carryIn)) : (carryIn < 0 ? ('кредит ' + fmt(-carryIn)) : 'не участвовал'),
      mode: mode, inactive: true
    };
  }

  var debt, credit = 0, carryOut;
  if (mode === 'fact') {
    debt = attCount * price + carryIn - paid;
    carryOut = debt;
  } else {
    debt = price * trainings + carryIn - paid;
    if (debt <= 0 && missed > 0) credit = missed * price;
    carryOut = debt - credit;
  }

  var st;
  if (debt > 0) st = 'долг: ' + fmt(debt);
  else if (credit > 0) st = 'кредит +' + fmt(credit);
  else st = 'оплачено';

  return { attCount: attCount, missed: missed, paid: paid, debt: debt, credit: credit, carryOut: carryOut, st: st, mode: mode, inactive: false };
}

function fmt(n) {
  return Math.round(Number(n) || 0).toLocaleString('ru-RU');
}

function show(v) {
  document.getElementById('view-d').classList.toggle('hidden', v !== 'd');
  document.getElementById('view-m').classList.toggle('hidden', v !== 'm');
  document.getElementById('nav-d').classList.toggle('active', v === 'd');
  document.getElementById('nav-m').classList.toggle('active', v === 'm');
  if (v === 'd') renderDashboard();
  if (v === 'm') renderMonthView();
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = 1;
  setTimeout(function() { t.style.opacity = 0; }, 2200);
}

function renderDashboard() {
  if (!monthData) {
    document.getElementById('dash-loading').classList.remove('hidden');
    document.getElementById('dash-content').classList.add('hidden');
    return;
  }
  document.getElementById('dash-loading').classList.add('hidden');
  document.getElementById('dash-content').classList.remove('hidden');

  var price = monthData.price || 200;
  var trainings = monthData.trainings || 5;
  var totalDebt = 0, collected = 0, debtors = 0, attSum = 0, attPlayers = 0;
  var html = '';

  (monthData.players || []).forEach(function(p) {
    var c = calcPlayer(p, price, trainings);
    totalDebt += Math.max(c.debt, 0);
    collected += c.paid;
    if (c.debt > 0) {
      debtors++;
      var rc = p.role === 'Админ' ? 'admin' : (p.role === 'Гость' ? 'guest' : 'player');
      html += '<div class="player-row"><div>' + p.name +
        '<span class="badge ' + rc + '">' + (p.role || '') + '</span>' +
        (c.mode === 'fact' ? '<span class="badge fact">за факт</span>' : '') +
        '</div><span class="debt">' + fmt(c.debt) + '</span></div>';
    }
    if (c.attCount + c.missed > 0) {
      attSum += c.attCount / (c.attCount + c.missed);
      attPlayers++;
    }
  });

  document.getElementById('s-debt').textContent = fmt(totalDebt);
  document.getElementById('s-paid').textContent = fmt(collected);
  document.getElementById('s-cnt').textContent = debtors;
  document.getElementById('s-att').textContent = attPlayers ? Math.round(attSum / attPlayers * 100) + '%' : '—';
  document.getElementById('debt-list').innerHTML = html || '<div class="empty">Нет сумм к оплате</div>';
}

function copyList() {
  if (!monthData) return;
  var price = monthData.price || 200;
  var trainings = monthData.trainings || 5;
  var text = 'Сумма к оплате (' + getMonth() + '):\n\n';
  (monthData.players || []).forEach(function(p) {
    var c = calcPlayer(p, price, trainings);
    if (c.debt > 0) {
      var reasons = [];
      if (c.inactive) reasons.push('перенос');
      else if (c.mode === 'fact') reasons.push('за факт: ' + c.attCount + ' игр');
      else {
        if (c.missed > 0) reasons.push(c.missed === 1 ? 'пропуск 1 игры' : 'пропуск ' + c.missed + ' игр');
        if (p.carryIn > 0) reasons.push('перенос с прошлого');
      }
      text += p.name + ': ' + fmt(c.debt) + (reasons.length ? ' (' + reasons.join(', ') + ')' : '') + '\n';
    }
  });
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { toast('Скопировано'); }).catch(function() { toast('Не удалось'); });
  } else {
    toast('Копирование недоступно');
  }
}

function renderMonthView() {
  var sel = document.getElementById('month-sel');
  sel.innerHTML = months.map(function(m) {
    return '<option value="' + m + '"' + (m === currentMonth ? ' selected' : '') + '>' + m + '</option>';
  }).join('');

  if (!monthData) {
    document.getElementById('month-loading').classList.remove('hidden');
    document.getElementById('month-table-card').classList.add('hidden');
    return;
  }
  document.getElementById('month-loading').classList.add('hidden');
  document.getElementById('month-error').classList.add('hidden');
  document.getElementById('month-table-card').classList.remove('hidden');

  var price = monthData.price || 200;
  var trainings = monthData.trainings || 5;
  document.getElementById('base').textContent = fmt(price * trainings);

  var mName = currentMonth || getMonth() || '';
  var html = '';

  (monthData.players || []).forEach(function(p) {
    var c = calcPlayer(p, price, trainings);
    var rc = p.role === 'Админ' ? 'admin' : (p.role === 'Гость' ? 'guest' : 'player');
    var att = p.att || ['', '', '', '', ''];
    var pay = p.pay || ['', '', '', '', ''];

    var attBtns = '';
    for (var i = 0; i < 5; i++) {
      var v = att[i] || '';
      var cls = v === 'Был' ? 'yes' : (v === 'Не был' ? 'no' : '');
      var sym = v === 'Был' ? '+' : (v === 'Не был' ? 'x' : '.');
      attBtns += '<td><button class="toggle-att ' + cls +
        '" onclick="toggleAtt(\'' + esc(p.name) + '\',' + (i + 1) + ',\'' + v + '\',\'' + esc(mName) + '\')">' +
        sym + '</button></td>';
    }

    var payBtns = '';
    for (var j = 0; j < 5; j++) {
      var pv = pay[j] || '';
      var pcls = pv === 'Сдал' ? 'yes' : (pv === 'Не сдал' ? 'no' : '');
      var psym = pv === 'Сдал' ? '+' : (pv === 'Не сдал' ? 'x' : '.');
      payBtns += '<td><button class="toggle-pay ' + pcls +
        '" onclick="togglePay(\'' + esc(p.name) + '\',' + (j + 1) + ',\'' + pv + '\',\'' + esc(mName) + '\')">' +
        psym + '</button></td>';
    }

    var modeBtns =
      '<div class="mode-wrap">' +
      '<button class="mode-btn ' + (c.mode !== 'fact' ? 'active-abo' : '') +
        '" onclick="setMode(\'' + esc(p.name) + '\',\'abo\',\'' + esc(mName) + '\')">абонемент</button>' +
      '<button class="mode-btn ' + (c.mode === 'fact' ? 'active-fact' : '') +
        '" onclick="setMode(\'' + esc(p.name) + '\',\'fact\',\'' + esc(mName) + '\')">за факт</button>' +
      '</div>';

    html += '<tr>' +
      '<td class="name"><b>' + p.name + '</b><br>' +
      '<span class="badge ' + rc + '">' + (p.role || '') + '</span>' +
      modeBtns +
      (p.carryIn ? '<div style="font-size:10px;color:var(--muted)">перенос ' + fmt(p.carryIn) + '</div>' : '') +
      '</td>' +
      attBtns + payBtns +
      '<td><input type="number" value="' + (p.adj || 0) + '" onchange="setAdj(\'' + esc(p.name) + '\', this.value, \'' + esc(mName) + '\')"></td>' +
      '<td><div class="' + (c.debt > 0 ? 'debt' : (c.credit > 0 ? 'credit' : 'ok')) + '">' + fmt(c.debt) + '</div>' +
      '<div style="font-size:10px;color:var(--muted)">' + c.st + '</div></td>' +
      '</tr>';
  });
  document.getElementById('tbody').innerHTML = html;
}

function esc(n) {
  return String(n).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function setMode(player, mode, monthFromBtn) {
  var month = String(monthFromBtn || getMonth() || '').trim();
  if (!month) {
    toast('Месяц не выбран. Открой вкладку «Месяц»');
    return;
  }
  var p = monthData && monthData.players
    ? monthData.players.find(function(x) { return x.name === player; })
    : null;
  if (!p) {
    toast('Игрок не найден');
    return;
  }
  if ((p.mode || 'abo') === mode) return;

  toast('Сохраняю (' + month + ')...');
  apiPost({ month: month, player: player, type: 'mode', value: mode })
    .then(function() {
      toast(mode === 'fact' ? 'Режим: за факт' : 'Режим: абонемент');
      return loadMonth(month);
    })
    .catch(function(e) {
      toast('Ошибка: ' + e.message);
    });
}

function toggleAtt(player, week, cur, monthFromBtn) {
  var month = String(monthFromBtn || getMonth() || '').trim();
  if (!month) { toast('Месяц не выбран'); return; }
  var next = cur === 'Был' ? 'Не был' : (cur === 'Не был' ? '' : 'Был');
  toast('Сохраняю...');
  apiPost({ month: month, player: player, type: 'att', week: week, value: next })
    .then(function() {
      var p = monthData.players.find(function(x) { return x.name === player; });
      if (p) p.att[week - 1] = next;
      renderMonthView();
      renderDashboard();
      toast('Сохранено');
    })
    .catch(function(e) { toast('Ошибка: ' + e.message); });
}

function togglePay(player, week, cur, monthFromBtn) {
  var month = String(monthFromBtn || getMonth() || '').trim();
  if (!month) { toast('Месяц не выбран'); return; }
  var next = cur === 'Сдал' ? 'Не сдал' : (cur === 'Не сдал' ? '' : 'Сдал');
  toast('Сохраняю...');
  apiPost({ month: month, player: player, type: 'pay', week: week, value: next })
    .then(function() {
      var p = monthData.players.find(function(x) { return x.name === player; });
      if (p) p.pay[week - 1] = next;
      renderMonthView();
      renderDashboard();
      toast('Сохранено');
    })
    .catch(function(e) { toast('Ошибка: ' + e.message); });
}

function setAdj(player, value, monthFromBtn) {
  var month = String(monthFromBtn || getMonth() || '').trim();
  if (!month) { toast('Месяц не выбран'); return; }
  apiPost({ month: month, player: player, type: 'adj', value: Number(value) || 0 })
    .then(function() {
      var p = monthData.players.find(function(x) { return x.name === player; });
      if (p) p.adj = Number(value) || 0;
      renderMonthView();
      renderDashboard();
      toast('Сохранено');
    })
    .catch(function(e) { toast('Ошибка: ' + e.message); });
}

function addPlayer() {
  var month = getMonth();
  if (!month) { toast('Сначала выберите месяц'); return; }
  var name = document.getElementById('new-player-name').value.trim();
  var role = document.getElementById('new-player-role').value;
  var mode = document.getElementById('new-player-mode').value;
  if (!name) { toast('Введите имя'); return; }
  toast('Добавляю...');
  apiPost({ action: 'addPlayer', month: month, player: name, role: role, mode: mode })
    .then(function() {
      document.getElementById('new-player-name').value = '';
      toast('Игрок добавлен');
      return loadMonth(month);
    })
    .catch(function(e) { toast('Ошибка: ' + e.message); });
}

function changeMonth() {
  currentMonth = document.getElementById('month-sel').value;
  loadMonth(currentMonth);
}

function loadMonth(name) {
  var monthName = String(name || '').trim();
  if (!monthName) {
    document.getElementById('month-error').textContent = 'Ошибка: пустое имя месяца';
    document.getElementById('month-error').classList.remove('hidden');
    return Promise.resolve();
  }

  document.getElementById('month-loading').classList.remove('hidden');
  document.getElementById('month-table-card').classList.add('hidden');
  document.getElementById('month-error').classList.add('hidden');

  return apiGet({ action: 'month', name: monthName })
    .then(function(data) {
      monthData = data;
      currentMonth = monthName;
      renderMonthView();
      renderDashboard();
    })
    .catch(function(e) {
      document.getElementById('month-loading').classList.add('hidden');
      document.getElementById('month-error').textContent = 'Ошибка: ' + e.message;
      document.getElementById('month-error').classList.remove('hidden');
    });
}

function createNextMonth() {
  if (!confirm('Создать следующий месяц и перенести долги по новым правилам?')) return;
  toast('Создаю...');
  apiPost({ action: 'newMonth' })
    .then(function(res) {
      toast('Создан: ' + res.month);
      return reloadAll().then(function() {
        currentMonth = res.month;
        return loadMonth(currentMonth);
      }).then(function() {
        show('m');
      });
    })
    .catch(function(e) { toast('Ошибка: ' + e.message); });
}

function reloadAll() {
  toast('Обновляю...');
  return apiGet({ action: 'months' })
    .then(function(data) {
      months = data.months || [];
      if (!currentMonth && months.length) currentMonth = months[0];
      if (currentMonth) return loadMonth(currentMonth);
    })
    .then(function() { toast('Обновлено'); })
    .catch(function(e) { toast('Ошибка: ' + e.message); });
}

function init() {
  apiGet({ action: 'months' })
    .then(function(data) {
      months = data.months || [];
      if (!months.length) {
        document.getElementById('dash-loading').textContent = 'Нет месяцев';
        return;
      }
      currentMonth = months.indexOf('Сентябрь') >= 0 ? 'Сентябрь' : months[0];
      return loadMonth(currentMonth).then(function() { show('d'); });
    })
    .catch(function(e) {
      document.getElementById('dash-loading').innerHTML =
        '<div style="color:var(--debt)">Ошибка подключения</div>' +
        '<div style="font-size:13px;margin-top:8px">' + e.message + '</div>' +
        '<button class="btn primary" style="margin-top:12px" onclick="init()">Повторить</button>';
    });
}

init();
</script>
</body>
</html>
