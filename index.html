<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Волейбол Учет</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f3f4f6;color:#111;min-height:100vh;padding-bottom:90px}
header{background:#1e40af;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;font-weight:700}
header p{font-size:11px;opacity:.85}
.nav{display:flex;gap:6px}
.nav button{background:rgba(255,255,255,.15);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500}
.nav button.active{background:rgba(255,255,255,.35)}
main{max-width:960px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px;overflow:hidden}
.card-h{padding:12px 16px;border-bottom:1px solid #eee;font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat .l{font-size:11px;color:#6b7280}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.stat .v.red{color:#dc2626}
.stat .v.green{color:#16a34a}
.btn{display:inline-block;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;border:none;cursor:pointer;background:#e5e7eb;color:#111}
.btn.primary{background:#1e40af;color:#fff}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.player-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #f3f4f6}
.player-row:last-child{border-bottom:none}
.badge{font-size:11px;padding:2px 6px;border-radius:4px;margin-left:6px}
.badge.admin{background:#ede9fe;color:#5b21b6}
.badge.player{background:#dbeafe;color:#1e40af}
.badge.guest{background:#fce7f3;color:#9d174d}
.debt{color:#dc2626;font-weight:600}
.ok{color:#16a34a}
.credit{color:#2563eb}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f9fafb;padding:8px 3px;font-weight:500;color:#6b7280;text-align:center;font-size:11px}
td{padding:6px 2px;text-align:center;border-top:1px solid #f3f4f6}
td.name{text-align:left;padding-left:8px;min-width:100px}

/* Посещение — круглые зелёный/оранжевый */
.toggle-att{width:30px;height:30px;border-radius:50%;border:1px solid #d1d5db;background:#f3f4f6;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.toggle-att.yes{background:#22c55e;color:#fff;border-color:#16a34a}
.toggle-att.no{background:#f97316;color:#fff;border-color:#ea580c}

/* Оплата — квадратные ФИОЛЕТОВЫЙ / РОЗОВЫЙ */
.toggle-pay{width:30px;height:30px;border-radius:6px;border:1px solid #d1d5db;background:#f3f4f6;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.toggle-pay.yes{background:#0d9488;color:#fff;border-color:#0f766e}
.toggle-pay.no{background:#e11d48;color:#fff;border-color:#be123c}

input[type=number],input[type=text],select{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}
input[type=number]{width:68px;text-align:center;padding:6px 4px}
.form-row{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px;align-items:flex-end}
.form-row label{font-size:11px;color:#6b7280;display:block;margin-bottom:3px}
.hidden{display:none!important}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;z-index:100;pointer-events:none;max-width:90%}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{padding:24px;text-align:center;color:#9ca3af}
.loading{padding:40px;text-align:center;color:#6b7280}
.error{padding:20px;text-align:center;color:#dc2626;background:#fef2f2;border-radius:12px;margin:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px;font-size:12px;color:#6b7280;border-top:1px solid #eee}
.legend span{display:flex;align-items:center;gap:5px}
.add-form{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;border-top:1px solid #eee}
@media (max-width:480px){
  .stats{grid-template-columns:1fr 1fr}
  .stat .v{font-size:18px}
  .toggle-att,.toggle-pay{width:32px;height:32px}
  td.name{min-width:90px;font-size:12px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>🏐 Волейбол Учет</h1>
    <p>Посещения и оплаты</p>
  </div>
  <div class="nav">
    <button id="nav-d" class="active" onclick="show('d')">Дашборд</button>
    <button id="nav-m" onclick="show('m')">Месяц</button>
  </div>
</header>

<main>
  <div id="view-d">
    <div id="dash-loading" class="loading">Загрузка...</div>
    <div id="dash-content" class="hidden">
      <div class="stats">
        <div class="stat"><div class="l">Общий долг</div><div class="v red" id="s-debt">0 ₺</div></div>
        <div class="stat"><div class="l">Собрано</div><div class="v green" id="s-paid">0 ₺</div></div>
        <div class="stat"><div class="l">С долгом</div><div class="v" id="s-cnt">0</div></div>
        <div class="stat"><div class="l">Посещаемость</div><div class="v" id="s-att">0%</div></div>
      </div>
      <div class="card">
        <div class="card-h">Должники <button class="btn" onclick="copyList()">📋 Копировать</button></div>
        <div id="debt-list"></div>
      </div>
      <div class="card">
        <div class="card-h">Действия</div>
        <div class="btn-row">
          <button class="btn primary" onclick="createNextMonth()">+ Новый месяц</button>
          <button class="btn" onclick="reloadAll()">🔄 Обновить</button>
        </div>
      </div>
    </div>
  </div>

  <div id="view-m" class="hidden">
    <div class="card">
      <div class="form-row">
        <div>
          <label>Месяц</label>
          <select id="month-sel" onchange="changeMonth()"></select>
        </div>
        <div style="margin-left:auto;text-align:right">
          <label>База к оплате</label>
          <div style="font-size:18px;font-weight:700" id="base">—</div>
        </div>
      </div>
    </div>

    <div id="month-loading" class="loading hidden">Загрузка месяца...</div>
    <div id="month-error" class="error hidden"></div>

    <div class="card" id="month-table-card">
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th style="text-align:left;padding-left:8px">Игрок</th>
              <th colspan="5">Посещение</th>
              <th colspan="5">Оплата</th>
              <th>Корр</th>
              <th>Долг</th>
            </tr>
            <tr>
              <th></th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
              <th></th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="legend">
        <span><span class="toggle-att yes" style="width:18px;height:18px;font-size:10px">✓</span> Был</span>
        <span><span class="toggle-att no" style="width:18px;height:18px;font-size:10px">✗</span> Не был</span>
        <span><span class="toggle-pay yes" style="width:18px;height:18px;font-size:10px">✓</span> Сдал</span>
        <span><span class="toggle-pay no" style="width:18px;height:18px;font-size:10px">✗</span> Не сдал</span>
      </div>

      <!-- Добавление игрока -->
      <div class="add-form">
        <div>
          <label>Имя нового игрока</label>
          <input type="text" id="new-player-name" placeholder="Имя" style="width:140px">
        </div>
        <div>
          <label>Роль</label>
          <select id="new-player-role">
            <option value="Игрок">Игрок</option>
            <option value="Админ">Админ</option>
            <option value="Гость">Гость</option>
          </select>
        </div>
        <button class="btn primary" onclick="addPlayer()">+ Добавить</button>
      </div>
    </div>
  </div>
</main>
<div id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyppm-Tkkk4BFAERBVRjdrMsT0nFYVOb2gVdjAPfw7gn_v_vy5WV_xXgna-25I5F3qmTA/exec';

let months = [];
let currentMonth = null;
let monthData = null;

async function apiGet(params) {
  const url = API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  if (!res.ok) throw new Error('Ошибка сети: ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function apiPost(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('Ошибка сети: ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function calcPlayer(p, price, trainings) {
  const base = price * trainings;
  const attCount = (p.att || []).filter(x => x === 'Был').length;
  const missed = Math.max(trainings - attCount, 0);
  const paid = (p.pay || []).filter(x => x === 'Сдал').length * price + (Number(p.adj) || 0);
  const debt = base + (Number(p.carryIn) || 0) - paid;
  const credit = (debt <= 0 && missed > 0) ? missed * price : 0;
  const st = debt > 0 ? `долг: ${fmt(debt)} ₺` : (credit > 0 ? `кредит +${fmt(credit)}` : 'оплачено');
  return { attCount, missed, paid, debt, credit, st };
}

function fmt(n) { return Math.round(Number(n) || 0).toLocaleString('ru-RU'); }

function show(v) {
  document.getElementById('view-d').classList.toggle('hidden', v !== 'd');
  document.getElementById('view-m').classList.toggle('hidden', v !== 'm');
  document.getElementById('nav-d').classList.toggle('active', v === 'd');
  document.getElementById('nav-m').classList.toggle('active', v === 'm');
  if (v === 'd') renderDashboard();
  if (v === 'm') renderMonthView();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2200);
}

function renderDashboard() {
  if (!monthData) {
    document.getElementById('dash-loading').classList.remove('hidden');
    document.getElementById('dash-content').classList.add('hidden');
    return;
  }
  document.getElementById('dash-loading').classList.add('hidden');
  document.getElementById('dash-content').classList.remove('hidden');

  const price = monthData.price || 200;
  const trainings = monthData.trainings || 5;
  let totalDebt = 0, collected = 0, debtors = 0, attSum = 0, attPlayers = 0;
  let html = '';

  (monthData.players || []).forEach(p => {
    const c = calcPlayer(p, price, trainings);
    totalDebt += Math.max(c.debt, 0);
    collected += c.paid;
    if (c.debt > 0) {
      debtors++;
      const roleClass = p.role === 'Админ' ? 'admin' : (p.role === 'Гость' ? 'guest' : 'player');
      html += `<div class="player-row"><div>${p.name}<span class="badge ${roleClass}">${p.role||''}</span></div><span class="debt">${fmt(c.debt)} ₺</span></div>`;
    }
    if (c.attCount + c.missed > 0) {
      attSum += c.attCount / (c.attCount + c.missed);
      attPlayers++;
    }
  });

  document.getElementById('s-debt').textContent = fmt(totalDebt) + ' ₺';
  document.getElementById('s-paid').textContent = fmt(collected) + ' ₺';
  document.getElementById('s-cnt').textContent = debtors;
  document.getElementById('s-att').textContent = attPlayers ? Math.round(attSum / attPlayers * 100) + '%' : '—';
  document.getElementById('debt-list').innerHTML = html || '<div class="empty">Нет должников 🎉</div>';
}

function copyList() {
  if (!monthData) return;
  const price = monthData.price || 200;
  const trainings = monthData.trainings || 5;
  let text = `Должники (${currentMonth}):\n\n`;
  (monthData.players || []).forEach(p => {
    const c = calcPlayer(p, price, trainings);
    if (c.debt > 0) text += `${p.name}: ${fmt(c.debt)} ₺\n`;
  });
  navigator.clipboard.writeText(text).then(() => toast('Список скопирован')).catch(() => toast('Не удалось'));
}

function renderMonthView() {
  const sel = document.getElementById('month-sel');
  sel.innerHTML = months.map(m => `<option value="${m}" ${m===currentMonth?'selected':''}>${m}</option>`).join('');

  if (!monthData) {
    document.getElementById('month-loading').classList.remove('hidden');
    document.getElementById('month-table-card').classList.add('hidden');
    return;
  }
  document.getElementById('month-loading').classList.add('hidden');
  document.getElementById('month-error').classList.add('hidden');
  document.getElementById('month-table-card').classList.remove('hidden');

  const price = monthData.price || 200;
  const trainings = monthData.trainings || 5;
  document.getElementById('base').textContent = fmt(price * trainings) + ' ₺';

  let html = '';
  (monthData.players || []).forEach(p => {
    const c = calcPlayer(p, price, trainings);
    const roleClass = p.role === 'Админ' ? 'admin' : (p.role === 'Гость' ? 'guest' : 'player');

    const attBtns = (p.att || ['','','','','']).map((v,i) => {
      const cls = v==='Был'?'yes':(v==='Не был'?'no':'');
      const sym = v==='Был'?'✓':(v==='Не был'?'✗':'·');
      return `<td><button class="toggle-att ${cls}" onclick="toggleAtt('${esc(p.name)}',${i+1},'${v}')">${sym}</button></td>`;
    }).join('');

    const payBtns = (p.pay || ['','','','','']).map((v,i) => {
      const cls = v==='Сдал'?'yes':(v==='Не сдал'?'no':'');
      const sym = v==='Сдал'?'✓':(v==='Не сдал'?'✗':'·');
      return `<td><button class="toggle-pay ${cls}" onclick="togglePay('${esc(p.name)}',${i+1},'${v}')">${sym}</button></td>`;
    }).join('');

    html += `<tr>
      <td class="name"><b>${p.name}</b><br><span class="badge ${roleClass}">${p.role||''}</span>
      ${p.carryIn?`<div style="font-size:10px;color:#9ca3af">перенос ${fmt(p.carryIn)}</div>`:''}</td>
      ${attBtns}${payBtns}
      <td><input type="number" value="${p.adj||0}" onchange="setAdj('${esc(p.name)}',this.value)"></td>
      <td><div class="${c.debt>0?'debt':(c.credit>0?'credit':'ok')}">${fmt(c.debt)} ₺</div>
      <div style="font-size:10px;color:#9ca3af">${c.st}</div></td>
    </tr>`;
  });
  document.getElementById('tbody').innerHTML = html;
}

function esc(n){ return String(n).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

async function toggleAtt(player, week, cur) {
  const next = cur==='Был' ? 'Не был' : (cur==='Не был' ? '' : 'Был');
  try {
    toast('Сохраняю...');
    await apiPost({ month: currentMonth, player, type: 'att', week, value: next });
    const p = monthData.players.find(x => x.name === player);
    if (p) p.att[week-1] = next;
    renderMonthView(); renderDashboard();
    toast('Сохранено');
  } catch(e){ toast('Ошибка: '+e.message); }
}

async function togglePay(player, week, cur) {
  const next = cur==='Сдал' ? 'Не сдал' : (cur==='Не сдал' ? '' : 'Сдал');
  try {
    toast('Сохраняю...');
    await apiPost({ month: currentMonth, player, type: 'pay', week, value: next });
    const p = monthData.players.find(x => x.name === player);
    if (p) p.pay[week-1] = next;
    renderMonthView(); renderDashboard();
    toast('Сохранено');
  } catch(e){ toast('Ошибка: '+e.message); }
}

async function setAdj(player, value) {
  try {
    await apiPost({ month: currentMonth, player, type: 'adj', value: Number(value)||0 });
    const p = monthData.players.find(x => x.name === player);
    if (p) p.adj = Number(value)||0;
    renderMonthView(); renderDashboard();
    toast('Корректировка сохранена');
  } catch(e){ toast('Ошибка: '+e.message); }
}

async function addPlayer() {
  const name = document.getElementById('new-player-name').value.trim();
  const role = document.getElementById('new-player-role').value;
  if (!name) { toast('Введите имя'); return; }

  try {
    toast('Добавляю...');
    await apiPost({ action: 'addPlayer', month: currentMonth, player: name, role: role });
    document.getElementById('new-player-name').value = '';
    toast('Игрок добавлен');
    await loadMonth(currentMonth);
  } catch(e) {
    toast('Ошибка: ' + e.message);
  }
}

async function changeMonth() {
  currentMonth = document.getElementById('month-sel').value;
  await loadMonth(currentMonth);
}

async function loadMonth(name) {
  document.getElementById('month-loading').classList.remove('hidden');
  document.getElementById('month-table-card').classList.add('hidden');
  document.getElementById('month-error').classList.add('hidden');
  try {
    monthData = await apiGet({ action: 'month', name });
    currentMonth = name;
    renderMonthView(); renderDashboard();
  } catch(e) {
    document.getElementById('month-loading').classList.add('hidden');
    document.getElementById('month-error').textContent = 'Ошибка: ' + e.message;
    document.getElementById('month-error').classList.remove('hidden');
  }
}

async function createNextMonth() {
  if (!confirm('Создать следующий месяц и перенести долги?')) return;
  try {
    toast('Создаю месяц...');
    const res = await apiPost({ action: 'newMonth' });
    toast('Создан месяц: ' + res.month);
    await reloadAll();
    currentMonth = res.month;
    await loadMonth(currentMonth);
    show('m');
  } catch(e) {
    toast('Ошибка: ' + e.message);
  }
}

async function reloadAll() {
  toast('Обновляю...');
  try {
    const data = await apiGet({ action: 'months' });
    months = data.months || [];
    if (!currentMonth && months.length) currentMonth = months[0];
    if (currentMonth) await loadMonth(currentMonth);
    toast('Обновлено');
  } catch(e){ toast('Ошибка: '+e.message); }
}

async function init() {
  try {
    const data = await apiGet({ action: 'months' });
    months = data.months || [];
    if (!months.length) {
      document.getElementById('dash-loading').textContent = 'Нет месяцев';
      return;
    }
    currentMonth = months.includes('Сентябрь') ? 'Сентябрь' : months[0];
    await loadMonth(currentMonth);
    show('d');
  } catch(e) {
    document.getElementById('dash-loading').innerHTML = `
      <div style="color:#dc2626">Ошибка подключения</div>
      <div style="font-size:13px;margin-top:8px">${e.message}</div>
      <button class="btn primary" style="margin-top:12px" onclick="init()">Повторить</button>`;
  }
}

init();
</script>
</body>
</html>
